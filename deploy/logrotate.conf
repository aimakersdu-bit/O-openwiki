# ==============================================================================
# OpenWiki 日志按天滚存与压缩配置 (Logrotate)
# 说明：按天切割日志，最多保留 14 天，开启 gzip 压缩，使用 copytruncate 防中断
# ==============================================================================

/data/openwiki/logs/*.log
/data/openwiki/logs/*/*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    create 0644 root root
}
