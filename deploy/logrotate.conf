# ==============================================================================
# OpenWiki 独立日志盘 (disk_log) 按天滚存与容量上限配置 (Logrotate)
# 说明：按天切割日志，单文件上限 100M 强制触发切割，最多保留 14 天，开启 gzip 压缩
# ==============================================================================

/data/disk_log/*.log
/data/disk_log/**/*.log
/data/openwiki/logs/*.log
/data/openwiki/logs/*/*.log {
    daily
    maxsize 100M
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    create 0644 root root
}
