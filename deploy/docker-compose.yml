version: '3.8'

services:
  orchestrator:
    build:
      context: ./unit1-orchestrator
      dockerfile: Dockerfile
    container_name: openwiki-orchestrator
    restart: always
    environment:
      - PORTAL_PORT=3000
      - DB_PATH=/data/orchestrator.db
    volumes:
      - orchestrator-data:/data
      - static-wiki-data:/var/www/openwiki-static
      - repo-cache:/repos
    ports:
      - "3000:3000"

  portal:
    build:
      context: ./unit2-portal
      dockerfile: Dockerfile
    container_name: openwiki-portal
    restart: always
    environment:
      - PORTAL_PORT=8080
      - ORCHESTRATOR_URL=http://orchestrator:3000
      - DB_PATH=/data/portal.db
    volumes:
      - portal-data:/data
    ports:
      - "8080:8080"
    depends_on:
      - orchestrator

  nginx:
    image: nginx:alpine
    container_name: openwiki-nginx
    restart: always
    volumes:
      - ./unit2-portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static-wiki-data:/var/www/openwiki-static:ro
    ports:
      - "80:80"
    depends_on:
      - portal
      - orchestrator

volumes:
  orchestrator-data:
  portal-data:
  static-wiki-data:
  repo-cache:
