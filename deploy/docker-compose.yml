version: '3.8'

services:
  # OpenWiki All-in-One 全家桶单容器服务
  openwiki:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openwiki-allinone
    restart: always
    environment:
      - NODE_ENV=production
    ports:
      # 映射 Nginx 入口端口 (80)
      - "80:80"
      # 可选：直接暴露微服务端口用于调试
      - "8080:8080"
      - "3000:3000"
    volumes:
      # 【有状态单卷挂载】将宿主机 ./data 目录挂载到容器内 /data/openwiki
      # 包含:
      #  - ./data/repos  : Git 源码仓库
      #  - ./data/static : 导出的静态 Wiki 页面
      #  - ./data/db     : SQLite 数据库文件 (orchestrator.db & portal.db)
      #  - ./data/logs   : 运行日志与 Nginx 切割日志
      - ./data:/data/openwiki
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
