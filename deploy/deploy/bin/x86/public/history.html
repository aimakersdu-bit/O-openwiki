<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>问答审计 - OpenWiki Enterprise Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header Navbar -->
  <header class="navbar">
    <div class="nav-left">
      <a href="index.html" class="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">OpenWiki <span class="badge">Portal</span></span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">📖 Wiki 仪表盘</a></li>
        <li><a href="admin.html">⚙️ 仓库运维与构建</a></li>
        <li><a href="history.html" class="active">💬 问答审计</a></li>
      </ul>
    </div>
    <div id="navbarUser"></div>
  </header>

  <!-- Main Container -->
  <main class="container">
    <section class="card">
      <div class="dashboard-header">
        <div>
          <h2>AI 代码问答历史审计</h2>
          <p class="subtitle">选择仓库查看当前用户历史提问记录与 AI 回答日志</p>
        </div>
        <div style="display: flex; gap: 0.75rem; align-items: center;">
          <select id="repoSelect" style="width: 220px;">
            <option value="">-- 请选择仓库 --</option>
          </select>
          <button id="queryBtn" class="btn btn-primary">🔍 查询日志</button>
        </div>
      </div>

      <div id="historyContainer">
        <p style="color: var(--text-secondary); text-align: center; padding: 2rem;">请在上方下拉菜单选择仓库并点击“查询日志”</p>
      </div>
    </section>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
