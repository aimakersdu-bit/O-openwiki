# OpenWiki 反向代理配置 (独立二进制部署模式)
# 安装: cp deploy/nginx-standalone.conf /etc/nginx/conf.d/openwiki.conf && nginx -t && nginx -s reload
# 访问入口: http://<ECS_IP>:8891/

server {
    listen 8891;
    server_name _;

    client_max_body_size 100M;

    # 根路径重定向到 portal
    location = / {
        return 302 /portal/;
    }

    # Portal 前端控制台
    location /portal/ {
        proxy_pass http://127.0.0.1:8099/portal/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portal 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:8099/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态 Wiki 页面 (try_files =404 避免缺失 JS 被回退为 index.html 的 text/html)
    location /wiki/ {
        alias /data/openwiki/static/;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Visualizer SSE 事件流 (rewrite 到 orchestrator /events 路由)
    location ~ ^/wiki/[^/]+/events$ {
        rewrite ^/wiki/[^/]+/events$ /events break;
        proxy_pass http://127.0.0.1:3009;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # Orchestrator QA 流式对话
    location /qa/ {
        proxy_pass http://127.0.0.1:3009/qa/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # MCP 协议端点
    location /mcp {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}
