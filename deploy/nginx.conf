worker_processes auto;
pid /var/run/nginx.pid;
error_log /data/openwiki/logs/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /data/openwiki/logs/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip 静态压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name _;

        # 1. 静态 Wiki 页面托管 (/wiki/)
        location /wiki/ {
            alias /data/openwiki/static/;
            index index.html;
            try_files $uri $uri/ /index.html;

            # 强效禁止浏览器无感强缓存，强制向后端/Nginx发起 ETag/Last-Modified 协商
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # 1.1 动态 Visualizer 长链接 SSE 事件代理 (/wiki/<repo_id>/events)
        location ~ ^/wiki/[^/]+/events$ {
            proxy_pass http://127.0.0.1:3000/api/events;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
        }

        # 2. Portal 后端 API 代理 (/api/)
        location /api/ {
            proxy_pass http://127.0.0.1:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Orchestrator QA 流式对话 API 代理 (/qa/)
        location /qa/ {
            proxy_pass http://127.0.0.1:3000/qa/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 支持 SSE / 流式 Response 不缓存
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
        }

        # 根目录默认重定向至 /wiki/openwiki/
        location = / {
            return 302 /wiki/openwiki/;
        }
    }
}
