worker_processes auto;
pid /var/run/nginx.pid;
error_log /data/openwiki/logs/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /data/openwiki/logs/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip 静态压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name _;

        client_max_body_size 100M;

        # ==============================================================================
        # 1. OpenCode 原有公共服务代理 (如果内网共享 80 端口网关)
        # ==============================================================================

        # Code Usage & LDAP Auth Service
        location /api/opencode/ {
            proxy_pass http://127.0.0.1:8091;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # Model Platform (Mock Server)
        location /api/v1/integrations/ {
            proxy_pass http://127.0.0.1:8092;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        location /v1/chat/completions {
            proxy_pass http://127.0.0.1:8092;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location /opencode-health {
            proxy_pass http://127.0.0.1:8091/health;
        }

        # ==============================================================================
        # 2. OpenWiki 知识库服务代理 (Unit 1 Orchestrator + Unit 2 Portal)
        # ==============================================================================

        # 根目录默认重定向至 /portal/
        location = / {
            return 302 /portal/;
        }

        # 2.1 静态 Wiki 页面托管 (/wiki/)
        location /wiki/ {
            alias /data/openwiki/static/;
            index index.html;
            try_files $uri $uri/ =404;

            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # 2.2 动态 Visualizer 长链接 SSE 事件代理 (支持多段仓库路径，rewrite 到 orchestrator /events 路由)
        location ~ ^/wiki/.+/events$ {
            rewrite ^/wiki/.+/events$ /events break;
            proxy_pass http://127.0.0.1:3009;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
        }

        # 2.3 Portal 前端控制台与资产代理 (/portal/)
        location /portal/ {
            proxy_pass http://127.0.0.1:8099/portal/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2.4 Orchestrator QA 流式对话 API 代理 (/qa/)
        location /qa/ {
            proxy_pass http://127.0.0.1:3009/qa/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 支持 SSE / 流式 Response 不缓存
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
        }

        # 2.5 OpenCode MCP 协议端点代理 (/mcp 与 /mcp/)
        location /mcp {
            proxy_pass http://127.0.0.1:3009;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 禁用缓冲以保证 Streamable HTTP 与 SSE 实时推流
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # 2.6 Portal 后端 API 代理 (/api/projects, /api/repos, /api/graph, /api/chat 等)
        # 注意: /api/opencode/ 与 /api/v1/integrations/ 会因更长前缀优先命中
        location /api/ {
            proxy_pass http://127.0.0.1:8099/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 600s;
        }
    }
}
