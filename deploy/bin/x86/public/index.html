<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>代码 Wiki 仪表盘 - OpenWiki Enterprise Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header Navbar -->
  <header class="navbar">
    <div class="nav-left">
      <a href="index.html" class="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">OpenWiki <span class="badge">Portal</span></span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="active">📖 Wiki 仪表盘</a></li>
        <li class="admin-only"><a href="admin.html">⚙️ 仓库运维与构建</a></li>
        <li class="admin-only"><a href="history.html">💬 问答审计</a></li>
      </ul>
    </div>
    <div id="navbarUser"></div>
  </header>

  <!-- Main Container -->
  <main class="container">
    <div class="dashboard-header">
      <div>
        <h2>企业代码 Wiki 仪表盘</h2>
        <p class="subtitle">在线查阅各代码仓库的生成 Wiki 或启动 AI 深度问答</p>
      </div>
      <button id="refreshBtn" class="btn btn-secondary">🔄 刷新列表</button>
    </div>

    <div id="repoList" class="repo-grid">
      <!-- Repo cards injected by JS -->
    </div>
  </main>

  <!-- Floating Chat Drawer -->
  <aside id="chatDrawer" class="chat-drawer">
    <div class="chat-header">
      <div>
        <h3 id="chatRepoTitle">AI 代码问答</h3>
        <span id="chatRepoBadge" class="badge">Repo</span>
      </div>
      <button id="closeChatBtn" class="btn-close">&times;</button>
    </div>
    <div class="chat-body" id="chatMessages">
      <div class="chat-welcome">
        <p>🤖 您正在针对该仓库进行 OpenWiki 智能问答。</p>
        <p>示例问题：</p>
        <ul>
          <li>“这个项目的核心模块架构是怎样的？”</li>
          <li>“如何在本地方便地启动调试此服务？”</li>
        </ul>
      </div>
    </div>
    <div class="chat-footer">
      <textarea id="chatInput" placeholder="输入关于代码仓库的问题... (Ctrl+Enter 发送)" rows="2"></textarea>
      <button id="sendChatBtn" class="btn btn-primary">发送</button>
    </div>
  </aside>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
