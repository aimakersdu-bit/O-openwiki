<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仓库运维管理 - OpenWiki Enterprise Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header Navbar -->
  <header class="navbar">
    <div class="nav-left">
      <a href="index.html" class="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">OpenWiki <span class="badge">Portal</span></span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">📖 Wiki 仪表盘</a></li>
        <li><a href="admin.html" class="active">⚙️ 仓库运维与构建</a></li>
        <li><a href="history.html">💬 问答审计</a></li>
      </ul>
    </div>
    <div id="navbarUser"></div>
  </header>

  <!-- Main Container -->
  <main class="container">
    <!-- Register New Repo Card -->
    <section class="card">
      <h2>注册代码仓库</h2>
      <p class="subtitle">配置 Git 仓库地址与调度规则，系统将自动增量拉取并编译 OpenWiki 静态文件</p>
      <form id="registerRepoForm">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label for="repoId">仓库唯一标识 ID (例如 order-service)</label>
            <input type="text" id="repoId" placeholder="order-service" required>
          </div>
          <div class="form-group">
            <label for="repoName">仓库显示名称</label>
            <input type="text" id="repoName" placeholder="订单微服务" required>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label for="gitUrl">Git 远程仓库地址 (HTTP / SSH)</label>
            <input type="text" id="gitUrl" placeholder="https://github.com/company/order-service.git" required>
          </div>
          <div class="form-group">
            <label for="branch">分支</label>
            <input type="text" id="branch" value="main" required>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label for="localPath">服务器本地工作目录 <span style="color:var(--text-secondary); font-weight:normal;">(可选，默认 /var/openwiki/repos/&lt;repo_id&gt;)</span></label>
            <input type="text" id="localPath" placeholder="/var/openwiki/repos/order-service">
          </div>
          <div class="form-group">
            <label for="schedule">Cron 调度表达式</label>
            <input type="text" id="schedule" value="0 2 * * *" required>
          </div>
        </div>

        <div id="adminAlert" class="alert" style="display:none;"></div>
        <button type="submit" class="btn btn-primary">➕ 提交注册并启动调度</button>
      </form>
    </section>

    <!-- Registered Repos & Build Management Table -->
    <section class="card">
      <div class="dashboard-header">
        <div>
          <h2>已注册仓库与构建状态</h2>
          <p class="subtitle">查看当前仓库的最新 Git HEAD 及手动触发构建操作</p>
        </div>
        <button id="refreshAdminBtn" class="btn btn-secondary">🔄 刷新列表</button>
      </div>

      <div style="overflow-x: auto;">
        <table class="data-table" id="adminRepoTable">
          <thead>
            <tr>
              <th>仓库 ID / 名称</th>
              <th>Git 地址 / 分支</th>
              <th>本地目录</th>
              <th>调度表达式</th>
              <th>服务状态</th>
              <th>最新构建记录</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            <!-- Loaded dynamically by JS -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Log Details Modal -->
  <div id="logModal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="logModalTitle">📋 构建日志与报错详情</h3>
        <button id="closeLogModalBtn" class="btn-close">&times;</button>
      </div>
      <div class="modal-body">
        <div id="logModalMeta" class="repo-meta" style="margin-bottom:0.75rem;"></div>
        <pre id="logModalContent" style="background:#0f172a; padding:1rem; border-radius:8px; color:#f8fafc; font-size:0.85rem; max-height:360px; overflow:auto; white-space:pre-wrap; word-break:break-all; font-family:monospace;"></pre>
      </div>
    </div>
  </div>

  <!-- Edit Repo Modal -->
  <div id="editModal" class="modal-overlay" style="display:none;">
    <div class="modal-card" style="max-width: 600px;">
      <div class="modal-header">
        <h3 id="editModalTitle">✏️ 编辑仓库配置</h3>
        <button id="closeEditModalBtn" class="btn-close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="editRepoForm">
          <input type="hidden" id="editRepoId">
          <div class="form-group">
            <label for="editRepoName">仓库显示名称</label>
            <input type="text" id="editRepoName" required>
          </div>
          <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label for="editGitUrl">Git 远程仓库地址</label>
              <input type="text" id="editGitUrl" required>
            </div>
            <div class="form-group">
              <label for="editBranch">分支</label>
              <input type="text" id="editBranch" required>
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label for="editLocalPath">服务器本地工作目录</label>
              <input type="text" id="editLocalPath" required>
            </div>
            <div class="form-group">
              <label for="editSchedule">Cron 调度表达式</label>
              <input type="text" id="editSchedule" required>
            </div>
          </div>
          <div id="editAlert" class="alert" style="display:none;"></div>
          <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-top:1rem;">
            <button type="button" id="cancelEditBtn" class="btn btn-secondary">取消</button>
            <button type="submit" class="btn btn-primary">💾 保存修改</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
