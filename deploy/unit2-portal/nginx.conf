# OpenWiki Nginx Reverse Proxy Configuration
server {
    listen 80;
    server_name _;

    # 1. Static Wiki Pages & Graph Visualizer (Nginx serves directly)
    location ~ ^/wiki/([^/]+)/(.*)$ {
        alias /var/www/openwiki-static/$1/$2;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # Enable caching for static assets & vendor libraries
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # 2. Portal Web App & Auth APIs -> Go Portal Server (Port 8080)
    location /portal/ {
        proxy_pass http://127.0.0.1:8080/portal/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Root redirect to /portal/
    location = / {
        return 301 /portal/;
    }

    # 3. OpenWiki Orchestrator APIs & Chat SSE -> Go Orchestrator Server (Port 3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Crucial for SSE (Server-Sent Events) streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
